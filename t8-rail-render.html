<!doctype html><html><body style="margin:0"><canvas id="c"></canvas><script type="module">
import * as pdfjs from "./node_modules/pdfjs-dist/build/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "./public/pdf.worker.min.mjs";
const bytes = await fetch("./test-t8-filled2.pdf").then(r => r.arrayBuffer());
const pdf = await pdfjs.getDocument({ data: bytes }).promise;
const page = await pdf.getPage(1);
const viewport = page.getViewport({ scale: 8 });
const canvas = document.getElementById("c");
canvas.width = viewport.width; canvas.height = viewport.height;
await page.render({ canvasContext: canvas.getContext("2d"), viewport, canvas }).promise;
document.title = "done";
</script></body></html>
