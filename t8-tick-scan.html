<!doctype html>
<html>
<body style="margin:0">
<canvas id="c"></canvas>
<pre id="out"></pre>
<script type="module">
  import * as pdfjs from "./node_modules/pdfjs-dist/build/pdf.min.mjs";
  pdfjs.GlobalWorkerOptions.workerSrc = "./public/pdf.worker.min.mjs";
  const bytes = await fetch("./t8-tick-src.pdf").then(r => r.arrayBuffer());
  const pdf = await pdfjs.getDocument({ data: bytes }).promise;
  const pdfPage = await pdf.getPage(1);
  const viewport = pdfPage.getViewport({ scale: 6 });
  const canvas = document.getElementById("c");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await pdfPage.render({ canvasContext: ctx, viewport, canvas }).promise;

  // Scan pixel columns just right of the left dimension rail (pdf x 361-364)
  // between pdf y 248 and 298 for dark rows = tick slashes/extension lines.
  const pageH = 792;
  const results = [];
  const xLo = Math.round(361 * 6);
  const xHi = Math.round(364 * 6);
  const yTopPdf = 298, yBotPdf = 248;
  const rows = [];
  for (let pdfY = yBotPdf; pdfY <= yTopPdf; pdfY += 1 / 6) {
    const sy = Math.round((pageH - pdfY) * 6);
    const data = ctx.getImageData(xLo, sy, xHi - xLo, 1).data;
    let dark = 0;
    for (let i = 0; i < data.length; i += 4) {
      const v = (data[i] + data[i+1] + data[i+2]) / 3;
      if (v < 128) dark += 1;
    }
    if (dark > 0) rows.push(pdfY.toFixed(2));
  }
  // Also scan the vertical rail itself to confirm its x: scan pdf x 355-365 at y 270
  const railScan = [];
  {
    const sy = Math.round((pageH - 272) * 6);
    for (let px = 350; px <= 370; px += 0.25) {
      const sx = Math.round(px * 6);
      const data = ctx.getImageData(sx, sy, 1, 1).data;
      const v = (data[0]+data[1]+data[2])/3;
      if (v < 128) railScan.push(px.toFixed(2));
    }
  }
  document.getElementById("out").textContent = JSON.stringify({ rows, railScan });
  document.title = "render-done";
</script>
</body>
</html>
